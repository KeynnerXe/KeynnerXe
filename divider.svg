<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 20" width="1200" height="20" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pulse" x1="0" x2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#58a6ff"/>
      <stop offset=".75" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#ffb454" stop-opacity="0"/>
    </linearGradient>
    <style>
      .p{animation:move 4s cubic-bezier(.6,0,.4,1) infinite}
      @keyframes move{from{transform:translateX(-260px)}to{transform:translateX(1200px)}}
    </style>
  </defs>
  <rect x="0" y="9" width="1200" height="2" fill="#1b2a4a"/>
  <rect class="p" x="0" y="9" width="260" height="2" fill="url(#pulse)"/>
  <rect x="592" y="4" width="12" height="12" transform="rotate(45 598 10)" fill="#070b14" stroke="#ffb454" stroke-width="2"/>
</svg>
