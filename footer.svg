<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" role="img" aria-label="La curiosidad inicia el proceso. La ejecución marca la diferencia." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#12203b"/>
    </pattern>
    <clipPath id="c"><rect width="1200" height="140" rx="18"/></clipPath>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .a{font-size:20px;fill:#c9d1d9;opacity:0;animation:in .6s ease .3s forwards}
      .b{font-size:20px;fill:#ffb454;opacity:0;animation:in .6s ease 1.3s forwards}
      .s{font-size:12px;letter-spacing:4px;fill:#5d6f93}
      .cur{fill:#58a6ff;animation:blink 1.1s steps(1) infinite}
      @keyframes in{to{opacity:1}}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="140" fill="#070b14"/>
    <rect width="1200" height="140" fill="url(#grid)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="139" rx="18" fill="none" stroke="#1b2a4a"/>
  <g class="mono" text-anchor="middle">
    <text class="a" x="600" y="58">La curiosidad inicia el proceso.</text>
    <text class="b" x="600" y="90">La ejecución marca la diferencia.</text>
    <text class="s" x="600" y="122">KEYNNERXE · EOF</text>
  </g>
  <rect class="cur" x="806" y="74" width="11" height="20"/>
</svg>
