<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="KeynnerXe — Desarrollador de Software" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#12203b" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="45%" r="55%">
      <stop offset="0" stop-color="#164e8a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#070b14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#cfe3ff"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity=".12"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .boot{font-size:15px;fill:#5d6f93;opacity:0;animation:in .35s ease forwards}
      .ok{fill:#ffb454}
      .b1{animation-delay:.2s}.b2{animation-delay:.8s}.b3{animation-delay:1.4s}
      .name{font-size:82px;font-weight:800;letter-spacing:8px;fill:url(#nameGrad);opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) 2s forwards}
      .role{font-size:15px;letter-spacing:5px;fill:#ffb454;opacity:0;animation:in .6s ease 2.6s forwards}
      .cursor{fill:#58a6ff;opacity:0;animation:in .1s 2.6s forwards,blink 1.1s steps(1) 2.7s infinite}
      .scan{animation:scan 7s linear infinite}
      .node{fill:#58a6ff;animation:pulse 3s ease-in-out infinite}
      .n2{animation-delay:.6s}.n3{animation-delay:1.2s}.n4{animation-delay:1.8s}.n5{animation-delay:2.4s}
      .link{stroke:#1f4f8c;stroke-width:1.5;stroke-dasharray:4 6;animation:flow 6s linear infinite}
      @keyframes in{to{opacity:1}}
      @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
      @keyframes blink{50%{opacity:0}}
      @keyframes scan{from{transform:translateY(-120px)}to{transform:translateY(340px)}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes flow{to{stroke-dashoffset:-120}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#070b14"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect class="scan" x="0" y="0" width="1200" height="110" fill="url(#scanGrad)"/>

    <!-- red de nodos -->
    <g>
      <line class="link" x1="905" y1="95" x2="1010" y2="150"/>
      <line class="link" x1="1010" y1="150" x2="1120" y2="100"/>
      <line class="link" x1="1010" y1="150" x2="985" y2="245"/>
      <line class="link" x1="985" y1="245" x2="1105" y2="225"/>
      <line class="link" x1="1120" y1="100" x2="1105" y2="225"/>
      <circle class="node" cx="905" cy="95" r="5"/>
      <circle class="node n2" cx="1010" cy="150" r="8"/>
      <circle class="node n3" cx="1120" cy="100" r="5"/>
      <circle class="node n4" cx="985" cy="245" r="5"/>
      <circle class="node n5" cx="1105" cy="225" r="6"/>
      <circle cx="1010" cy="150" r="18" fill="none" stroke="#58a6ff" stroke-opacity=".35"/>
    </g>

    <!-- esquinas -->
    <g fill="none" stroke="#ffb454" stroke-width="2">
      <path d="M24 52V24h28"/><path d="M1148 24h28v28"/>
      <path d="M24 268v28h28"/><path d="M1176 268v28h-28"/>
    </g>

    <!-- secuencia de arranque -->
    <g class="mono">
      <text class="boot b1" x="60" y="66">&gt; iniciando keynnerxe.sys <tspan class="ok">[ ok ]</tspan></text>
      <text class="boot b2" x="60" y="92">&gt; cargando módulos: backend · apis · bases de datos <tspan class="ok">[ ok ]</tspan></text>
      <text class="boot b3" x="60" y="118">&gt; modo: aprender construyendo <tspan class="ok">[ activo ]</tspan></text>
      <text class="name" x="56" y="212">KEYNNERXE</text>
      <rect class="cursor" x="588" y="150" width="22" height="64"/>
      <text class="role" x="62" y="256">DESARROLLADOR DE SOFTWARE · COLOMBIA</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="18" fill="none" stroke="#1b2a4a"/>
</svg>
